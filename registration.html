<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="registration.html">Registration Form</a></li>
            <li><a href="records.html">Student Records</a></li>
        </ul>
    </nav>
    <main>
        <h1 class="page-title">Student Registration</h1>
        <form id="profile-form" action="#" method="get" novalidate>
            <div class="form-group">
                <label for="student-id">Student ID:</label>
                <input type="text" id="student-id" name="student-id" required minlength="1">
            </div>
            <div class="form-group">
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" name="full-name" required>
            </div>
            <div class="form-group">
                <label for="email">School Email:</label>
                <input type="email" id="email" name="school-email" required>
            </div>
            <div class="form-group">
                <label for="birth-date">Birth Date:</label>
                <input type="date" id="birth-date" name="birth-date">
            </div>
            <div class="form-group">
                <label for="program">Program:</label>
                <select id="program" name="program" required>
                    <option value=""></option>
                    <option value="BS Information Technology">BS Information Technology</option>
                    <option value="BS Computer Science">BS Computer Science</option>
                </select>
            </div>
            <fieldset>
                <legend>Year Level:</legend>
                <div class="form-group">
                    <input type="radio" id="year1" name="year-level" value="1" required>
                    <label for="year1">1st Year</label>
                </div>
                <div class="form-group">
                    <input type="radio" id="year2" name="year-level" value="2" required>
                    <label for="year2">2nd Year</label>
                </div>
                <div class="form-group">
                    <input type="radio" id="year3" name="year-level" value="3" required>
                    <label for="year3">3rd Year</label>
                </div>
                <div class="form-group">
                    <input type="radio" id="year4" name="year-level" value="4" required>
                    <label for="year4">4th Year</label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Interests:</legend>
                <div class="form-group">
                    <input type="checkbox" id="interest1" name="interests" value="coding">
                    <label for="interest1">Coding</label>
                </div>
                <div class="form-group">
                    <input type="checkbox" id="interest2" name="interests" value="gaming">
                    <label for="interest2">Gaming</label>
                </div>
                <div class="form-group">
                    <input type="checkbox" id="interest3" name="interests" value="design">
                    <label for="interest3">Design</label>
                </div>
            </fieldset>
            <div class="form-group">
                <label for="about">Profile Description:</label>
                <textarea id="about" name="profile-description" maxlength="150"></textarea>
                <p id="about-count" aria-live="polite">0/150 characters</p>
            </div>
            <div class="form-group">
                <input type="checkbox" id="terms" name="terms">
                <label for="terms">I confirm the information above is correct</label>
            </div>
            <div id="form-feedback" aria-live="polite"></div>
            <div class="form-group">
                <button type="submit">Submit</button>
            </div>
        </form>
    </main>
</body>
</html>
